name: Verificar Moodle

on:
  schedule:
    # A cada 30 minutos: atualiza prazos e faltas e responde o WhatsApp.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      teste:
        description: "Mandar uma mensagem de teste no WhatsApp"
        type: boolean
        default: false

permissions:
  contents: write

# Só uma execução por vez usa a sessão do WhatsApp.
concurrency:
  group: whatsapp-sessao
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar Moodle
        env:
          MOODLE_USER: ${{ secrets.MOODLE_USER }}
          MOODLE_PASSWORD: ${{ secrets.MOODLE_PASSWORD }}
        run: python main.py

      - name: Buscar faltas no portal
        if: ${{ !cancelled() }}
        env:
          PORTAL_USER: ${{ secrets.PORTAL_USER }}
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
          MOODLE_USER: ${{ secrets.MOODLE_USER }}
          MOODLE_PASSWORD: ${{ secrets.MOODLE_PASSWORD }}
        run: python faltas.py

      - name: Salvar histórico
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add eventos.json
          [ -f faltas.json ] && git add faltas.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração no histórico."
          else
            git commit -m "Atualizar histórico do Moodle e faltas"
            git push
          fi

      # ---------------- WhatsApp ----------------

      - name: Configurar Node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: whatsapp/package-lock.json

      - name: Instalar bot do WhatsApp
        if: ${{ !cancelled() }}
        working-directory: whatsapp
        run: npm ci --no-audit --no-fund

      - name: Restaurar sessão do WhatsApp
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@v4
        with:
          path: wa-session.enc
          key: wa-sessao-${{ github.run_id }}
          restore-keys: wa-sessao-

      - name: Avisos e conversa no WhatsApp
        id: whatsapp
        if: ${{ !cancelled() }}
        env:
          WA_SESSION_KEY: ${{ secrets.WA_SESSION_KEY }}
          WHATSAPP_OWNER: ${{ secrets.WHATSAPP_OWNER }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WA_TESTE: ${{ inputs.teste && '1' || '' }}
        run: |
          if [ -z "$WA_SESSION_KEY" ] || [ ! -f wa-session.enc ]; then
            echo "WhatsApp ainda não configurado/pareado. Pulando."
            exit 0
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:WA_SESSION_KEY \
            -in wa-session.enc | tar xz -C whatsapp/auth
          set +e
          node whatsapp/run.js
          status=$?
          set -e
          # Guarda a sessão mesmo se algo falhou, para não perder o pareamento.
          tar cz -C whatsapp/auth . | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -pass env:WA_SESSION_KEY -out wa-session.enc
          echo "salvar=1" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Guardar sessão do WhatsApp
        if: ${{ !cancelled() && steps.whatsapp.outputs.salvar == '1' }}
        uses: actions/cache/save@v4
        with:
          path: wa-session.enc
          key: wa-sessao-${{ github.run_id }}-${{ github.run_attempt }}
