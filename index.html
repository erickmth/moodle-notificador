<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prazos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #f5f7fa;
            --card: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --primary: #111827;
            --danger: #dc2626;
            --warning: #d97706;
            --success: #16a34a;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        .container {
            width: min(1200px, calc(100% - 32px));
            margin: 0 auto;
            padding: 35px 0 50px;
        }

        .header {
            margin-bottom: 28px;
        }

        .header h1 {
            margin: 0 0 7px;
            font-size: 32px;
            font-weight: 750;
            letter-spacing: -0.7px;
        }

        .header p {
            margin: 0;
            color: var(--muted);
            font-size: 15px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            min-height: 110px;
        }

        .summary-label {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 10px;
        }

        .summary-value {
            font-size: 28px;
            font-weight: 750;
            line-height: 1;
        }

        .search-area {
            margin-bottom: 25px;
        }

        .search {
            width: 100%;
            height: 48px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: white;
            padding: 0 16px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        .search:focus {
            border-color: #9ca3af;
            box-shadow: 0 0 0 3px rgba(17, 24, 39, 0.06);
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        .status-text {
            color: var(--muted);
            font-size: 13px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--muted);
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
        }

        .date-group {
            margin-bottom: 30px;
        }

        .date-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 15px;
            font-weight: 700;
        }

        .date-title::before {
            content: "";
            width: 4px;
            height: 18px;
            border-radius: 5px;
            background: var(--primary);
        }

        .event-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 10px;
            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease,
                border-color 0.15s ease;
        }

        .event-card:hover {
            transform: translateY(-1px);
            border-color: #d1d5db;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.05);
        }

        .event-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }

        .event-info {
            min-width: 0;
            flex: 1;
        }

        .event-name {
            margin: 0 0 7px;
            font-size: 16px;
            font-weight: 700;
            line-height: 1.4;
        }

        .event-course {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .event-date {
            color: #374151;
            font-size: 13px;
        }

        .event-date strong {
            font-weight: 650;
        }

        .event-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            flex-shrink: 0;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 9px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .badge-atrasado {
            color: var(--danger);
            background: #fef2f2;
        }

        .badge-proximo {
            color: var(--warning);
            background: #fffbeb;
        }

        .badge-normal {
            color: var(--success);
            background: #f0fdf4;
        }

        .event-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 34px;
            padding: 0 12px;
            border-radius: 9px;
            background: #111827;
            color: white;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            transition: 0.2s;
        }

        .event-link:hover {
            background: #374151;
        }

        .empty {
            background: white;
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
        }

        .empty-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .empty-text {
            color: var(--muted);
            font-size: 13px;
        }

        .loading {
            background: white;
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 35px 20px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }

        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            border-radius: 15px;
            padding: 20px;
            font-size: 14px;
        }

        @media (max-width: 900px) {
            .summary {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 650px) {
            .container {
                width: min(100% - 20px, 1200px);
                padding-top: 25px;
            }

            .header h1 {
                font-size: 27px;
            }

            .summary {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .summary-card {
                padding: 16px;
                min-height: 95px;
            }

            .summary-value {
                font-size: 24px;
            }

            .event-card {
                padding: 15px;
            }

            .event-top {
                flex-direction: column;
                gap: 13px;
            }

            .event-right {
                width: 100%;
                align-items: flex-start;
            }

            .event-link {
                width: 100%;
            }
        }

        @media (max-width: 400px) {
            .summary {
                grid-template-columns: 1fr 1fr;
            }

            .summary-value {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header class="header">
        <h1>Prazos</h1>
        <p>Atividades do AVA, atualizadas automaticamente</p>
    </header>

    <section class="summary">

        <div class="summary-card">
            <div class="summary-label">Total de atividades</div>
            <div class="summary-value" id="total">0</div>
        </div>

        <div class="summary-card">
            <div class="summary-label">Atrasadas</div>
            <div class="summary-value" id="atrasadas">0</div>
        </div>

        <div class="summary-card">
            <div class="summary-label">Próximos 7 dias</div>
            <div class="summary-value" id="proximos">0</div>
        </div>

        <div class="summary-card">
            <div class="summary-label">Próxima entrega</div>
            <div class="summary-value" id="proxima">—</div>
        </div>

    </section>

    <section class="search-area">
        <input
            type="text"
            id="search"
            class="search"
            placeholder="Pesquisar atividade ou disciplina..."
            autocomplete="off"
        >
    </section>

    <div class="status">

        <div class="status-text" id="statusText">
            Carregando atividades...
        </div>

        <div class="status-indicator">
            <span class="status-dot"></span>
            <span>Atualizado automaticamente</span>
        </div>

    </div>

    <main id="lista">

        <div class="loading">
            Carregando atividades...
        </div>

    </main>

</div>

<script>

    let todosEventos = [];


    function formatarDataHora(timestamp) {

        if (!timestamp) {
            return "Data não informada";
        }

        const data = new Date(Number(timestamp) * 1000);

        return new Intl.DateTimeFormat(
            "pt-BR",
            {
                timeZone: "America/Sao_Paulo",
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        ).format(data);
    }


    function formatarSomenteData(timestamp) {

        if (!timestamp) {
            return "Data não informada";
        }

        const data = new Date(Number(timestamp) * 1000);

        return new Intl.DateTimeFormat(
            "pt-BR",
            {
                timeZone: "America/Sao_Paulo",
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            }
        ).format(data);
    }


    /*
     * Retorna as partes da data no fuso
     * de São Paulo.
     *
     * Isso evita comparar a data do navegador
     * com uma data UTC de forma incorreta.
     */
    function obterPartesData(timestamp) {

        const data = new Date(Number(timestamp) * 1000);

        const partes = new Intl.DateTimeFormat(
            "en-US",
            {
                timeZone: "America/Sao_Paulo",
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            }
        ).formatToParts(data);


        const resultado = {};

        for (const parte of partes) {

            if (parte.type !== "literal") {
                resultado[parte.type] = Number(parte.value);
            }
        }


        return resultado;
    }


    /*
     * Retorna uma chave YYYY-MM-DD
     * considerando São Paulo.
     */
    function obterChaveData(timestamp) {

        const partes =
            obterPartesData(timestamp);


        return [
            partes.year,
            String(partes.month).padStart(2, "0"),
            String(partes.day).padStart(2, "0")
        ].join("-");
    }


    /*
     * Cria um objeto Date representando
     * somente a data do calendário.
     */
    function obterDataCalendario(timestamp) {

        const partes =
            obterPartesData(timestamp);


        return new Date(
            partes.year,
            partes.month - 1,
            partes.day
        );
    }


    /*
     * Retorna a diferença entre duas datas
     * ignorando o horário.
     *
     * Exemplo:
     *
     * 22/09 -> 22/09 = 0
     * 22/09 -> 23/09 = 1
     * 22/09 -> 24/09 = 2
     */
    function diferencaDiasCalendario(
        dataInicial,
        dataFinal
    ) {

        const inicio =
            new Date(
                dataInicial.getFullYear(),
                dataInicial.getMonth(),
                dataInicial.getDate()
            );


        const fim =
            new Date(
                dataFinal.getFullYear(),
                dataFinal.getMonth(),
                dataFinal.getDate()
            );


        const diferenca =
            fim.getTime() -
            inicio.getTime();


        return Math.round(
            diferenca /
            (1000 * 60 * 60 * 24)
        );
    }


    function obterChaveAtividade(evento) {

        if (evento.url) {

            try {

                const url = new URL(evento.url);

                const id =
                    url.searchParams.get("id");

                if (id) {
                    return `moodle-id:${id}`;
                }

            } catch (erro) {
                // Continua.
            }
        }


        if (evento.url) {

            try {

                const url = new URL(evento.url);

                return (
                    `url:${url.pathname}${url.search}`
                );

            } catch (erro) {
                // Continua.
            }
        }


        const nome =
            String(evento.nome || "")
                .toLowerCase()
                .replace(
                    /\s+(está|esta)\s+marcado\(a\)\s+para\s+esta\s+data/gi,
                    ""
                )
                .replace(
                    /\s*\((abertura|encerramento)\s+da\s+enquete\)/gi,
                    ""
                )
                .trim();


        return [
            evento.curso_id || "",
            evento.disciplina || "",
            nome
        ].join("|");
    }


    /*
     * Mantém somente o prazo real da atividade.
     *
     * Se houver:
     *
     * open
     * due
     * close
     *
     * somente o due será mostrado.
     */
    function normalizarAtividades(eventos) {

        const grupos = new Map();


        for (const evento of eventos) {

            if (!evento) {
                continue;
            }


            const tipo =
                String(evento.tipo || "")
                    .toLowerCase();


            if (
                tipo !== "due" &&
                tipo !== "open" &&
                tipo !== "close"
            ) {
                continue;
            }


            const chave =
                obterChaveAtividade(evento);


            if (!grupos.has(chave)) {
                grupos.set(chave, []);
            }


            grupos.get(chave).push(evento);
        }


        const resultado = [];


        for (
            const eventosDaAtividade
            of grupos.values()
        ) {

            const eventosDue =
                eventosDaAtividade.filter(
                    evento =>
                        String(evento.tipo || "")
                            .toLowerCase() === "due"
                );


            if (eventosDue.length > 0) {

                eventosDue.sort(
                    (a, b) =>
                        Number(
                            a.timestamp ||
                            a.timesort ||
                            0
                        ) -
                        Number(
                            b.timestamp ||
                            b.timesort ||
                            0
                        )
                );


                resultado.push(
                    eventosDue[0]
                );
            }
        }


        return resultado;
    }


    function foiEnviada(evento) {

        if (!evento) {
            return false;
        }


        if (
            evento.enviado === true ||
            evento.notificacao_enviada === true
        ) {
            return true;
        }


        if (
            String(evento.status || "")
                .toLowerCase() === "enviado"
        ) {
            return true;
        }


        return false;
    }


    /*
     * Calcula o estado da atividade
     * usando a data do calendário.
     *
     * Isso é importante:
     *
     * 22/09 às 19:00
     * 22/09 às 23:59
     *
     * continua sendo HOJE.
     */
    function obterEstado(evento) {

        const timestamp =
            Number(
                evento.timestamp ||
                evento.timesort ||
                0
            );


        if (!timestamp) {

            return {
                classe: "badge-normal",
                texto: "Sem data"
            };
        }


        const agora =
            new Date();


        const dataEntrega =
            new Date(timestamp * 1000);


        const hoje =
            new Date(
                agora.getFullYear(),
                agora.getMonth(),
                agora.getDate()
            );


        const dataEntregaCalendario =
            obterDataCalendario(timestamp);


        const diferenca =
            diferencaDiasCalendario(
                hoje,
                dataEntregaCalendario
            );


        /*
         * Prazo em um dia anterior.
         */
        if (diferenca < 0) {

            const dias =
                Math.abs(diferenca);


            if (dias === 0) {

                return {
                    classe: "badge-atrasado",
                    texto: "Atrasado hoje"
                };
            }


            return {
                classe: "badge-atrasado",
                texto:
                    `${dias} dia${dias === 1 ? "" : "s"} de atraso`
            };
        }


        /*
         * Prazo é hoje.
         */
        if (diferenca === 0) {

            return {
                classe: "badge-proximo",
                texto:
                    `Entrega hoje às ${obterHora(dataEntrega)}`
            };
        }


        /*
         * Prazo amanhã.
         */
        if (diferenca === 1) {

            return {
                classe: "badge-proximo",
                texto:
                    `Entrega amanhã às ${obterHora(dataEntrega)}`
            };
        }


        /*
         * Prazo dentro dos próximos 7 dias.
         */
        if (diferenca <= 7) {

            return {
                classe: "badge-proximo",
                texto:
                    `Entrega em ${diferenca} dias`
            };
        }


        return {
            classe: "badge-normal",
            texto: "Prazo futuro"
        };
    }


    /*
     * Retorna somente HH:MM no horário
     * de São Paulo.
     */
    function obterHora(timestampOuData) {

        const data =
            timestampOuData instanceof Date
                ? timestampOuData
                : new Date(
                    Number(timestampOuData) * 1000
                );


        return new Intl.DateTimeFormat(
            "pt-BR",
            {
                timeZone: "America/Sao_Paulo",
                hour: "2-digit",
                minute: "2-digit",
                hour12: false
            }
        ).format(data);
    }


    function obterTextoPrazo(evento) {

        const timestamp =
            Number(
                evento.timestamp ||
                evento.timesort ||
                0
            );


        if (!timestamp) {
            return "Prazo não informado";
        }


        const agora =
            new Date();


        const dataEntrega =
            new Date(timestamp * 1000);


        const hoje =
            new Date(
                agora.getFullYear(),
                agora.getMonth(),
                agora.getDate()
            );


        const dataEntregaCalendario =
            obterDataCalendario(timestamp);


        const diferenca =
            diferencaDiasCalendario(
                hoje,
                dataEntregaCalendario
            );


        /*
         * Prazo já passou no calendário.
         */
        if (diferenca < 0) {

            const dias =
                Math.abs(diferenca);


            if (dias === 1) {
                return "1 dia de atraso";
            }


            return `${dias} dias de atraso`;
        }


        /*
         * Mesmo dia:
         *
         * Só fica atrasado quando o horário
         * realmente passar.
         */
        if (diferenca === 0) {

            if (
                dataEntrega.getTime() <
                agora.getTime()
            ) {

                return "Prazo encerrado hoje";
            }


            return `Entrega hoje às ${obterHora(dataEntrega)}`;
        }


        if (diferenca === 1) {

            return `Entrega amanhã às ${obterHora(dataEntrega)}`;
        }


        if (diferenca <= 7) {

            return `Entrega em ${diferenca} dias`;
        }


        return `Entrega em ${diferenca} dias`;
    }


    function agruparPorData(eventos) {

        const grupos = {};


        for (const evento of eventos) {

            const timestamp =
                Number(
                    evento.timestamp ||
                    evento.timesort ||
                    0
                );


            const chave =
                timestamp
                    ? formatarSomenteData(timestamp)
                    : "Data não informada";


            if (!grupos[chave]) {
                grupos[chave] = [];
            }


            grupos[chave].push(evento);
        }


        return grupos;
    }


    function ordenarEventos(eventos) {

        return [...eventos].sort(
            (a, b) => {

                const dataA =
                    Number(
                        a.timestamp ||
                        a.timesort ||
                        0
                    );


                const dataB =
                    Number(
                        b.timestamp ||
                        b.timesort ||
                        0
                    );


                return dataA - dataB;
            }
        );
    }


    /*
     * Atualiza o resumo superior.
     *
     * "Próximos 7 dias" agora usa dias do calendário.
     *
     * Se hoje é 22/09:
     *
     * 22/09 = dentro dos próximos 7 dias
     * 23/09 = dentro dos próximos 7 dias
     * ...
     * 29/09 = dentro dos próximos 7 dias
     */
    function atualizarResumo(eventos) {

        const agora =
            new Date();


        const hoje =
            new Date(
                agora.getFullYear(),
                agora.getMonth(),
                agora.getDate()
            );


        const atrasadas =
            eventos.filter(evento => {

                const timestamp =
                    Number(
                        evento.timestamp ||
                        evento.timesort ||
                        0
                    );


                if (!timestamp) {
                    return false;
                }


                const dataEntrega =
                    new Date(timestamp * 1000);


                const dataCalendario =
                    obterDataCalendario(timestamp);


                const diferenca =
                    diferencaDiasCalendario(
                        hoje,
                        dataCalendario
                    );


                /*
                 * Só considera atrasada se:
                 *
                 * - a data já passou
                 *
                 * ou
                 *
                 * - é hoje e o horário já passou.
                 */
                if (diferenca < 0) {
                    return true;
                }


                if (diferenca === 0) {

                    return (
                        dataEntrega.getTime() <
                        agora.getTime()
                    );
                }


                return false;

            }).length;


        const proximos =
            eventos.filter(evento => {

                const timestamp =
                    Number(
                        evento.timestamp ||
                        evento.timesort ||
                        0
                    );


                if (!timestamp) {
                    return false;
                }


                const dataCalendario =
                    obterDataCalendario(timestamp);


                const diferenca =
                    diferencaDiasCalendario(
                        hoje,
                        dataCalendario
                    );


                return (
                    diferenca >= 0 &&
                    diferenca <= 7
                );

            }).length;


        document.getElementById("total")
            .textContent =
            eventos.length;


        document.getElementById("atrasadas")
            .textContent =
            atrasadas;


        document.getElementById("proximos")
            .textContent =
            proximos;


        /*
         * Próxima entrega.
         */
        const futuras =
            eventos
                .filter(evento => {

                    const timestamp =
                        Number(
                            evento.timestamp ||
                            evento.timesort ||
                            0
                        );


                    if (!timestamp) {
                        return false;
                    }


                    return (
                        timestamp * 1000 >=
                        agora.getTime()
                    );

                })
                .sort(
                    (a, b) =>
                        Number(
                            a.timestamp ||
                            a.timesort ||
                            0
                        ) -
                        Number(
                            b.timestamp ||
                            b.timesort ||
                            0
                        )
                );


        if (futuras.length > 0) {

            const timestamp =
                Number(
                    futuras[0].timestamp ||
                    futuras[0].timesort ||
                    0
                );


            document.getElementById("proxima")
                .textContent =
                formatarSomenteData(timestamp);

        } else {

            document.getElementById("proxima")
                .textContent =
                "—";
        }
    }


    function renderizar(eventos) {

        const lista =
            document.getElementById("lista");


        if (!eventos.length) {

            lista.innerHTML = `
                <div class="empty">

                    <div class="empty-title">
                        Nenhuma atividade encontrada
                    </div>

                    <div class="empty-text">
                        Não existem atividades com prazo
                        para exibir no momento.
                    </div>

                </div>
            `;

            return;
        }


        const grupos =
            agruparPorData(eventos);


        let html = "";


        for (
            const [data, eventosDaData]
            of Object.entries(grupos)
        ) {

            const ordenados =
                ordenarEventos(
                    eventosDaData
                );


            html += `
                <section class="date-group">

                    <div class="date-title">
                        ${escaparHTML(data)}
                    </div>
            `;


            for (const evento of ordenados) {

                const estado =
                    obterEstado(evento);


                const timestamp =
                    Number(
                        evento.timestamp ||
                        evento.timesort ||
                        0
                    );


                const dataHora =
                    timestamp
                        ? formatarDataHora(timestamp)
                        : "Data não informada";


                const nome =
                    evento.nome ||
                    "Atividade sem nome";


                const disciplina =
                    evento.disciplina ||
                    "Disciplina não identificada";


                const url =
                    evento.url ||
                    "";


                const textoPrazo =
                    obterTextoPrazo(evento);


                html += `
                    <article
                        class="event-card"
                        data-search="
                            ${escaparHTML(nome.toLowerCase())}
                            ${escaparHTML(disciplina.toLowerCase())}
                        "
                    >

                        <div class="event-top">

                            <div class="event-info">

                                <h2 class="event-name">
                                    ${escaparHTML(nome)}
                                </h2>

                                <div class="event-course">
                                    ${escaparHTML(disciplina)}
                                </div>

                                <div class="event-date">
                                    <strong>Prazo:</strong>
                                    ${escaparHTML(dataHora)}
                                </div>

                            </div>

                            <div class="event-right">

                                <span class="badge ${estado.classe}">
                                    ${escaparHTML(textoPrazo)}
                                </span>

                                ${
                                    url
                                        ? `
                                            <a
                                                class="event-link"
                                                href="${escaparAtributo(url)}"
                                                target="_blank"
                                                rel="noopener noreferrer"
                                            >
                                                Abrir no Moodle
                                            </a>
                                        `
                                        : ""
                                }

                            </div>

                        </div>

                    </article>
                `;
            }


            html += `
                </section>
            `;
        }


        lista.innerHTML =
            html;
    }


    function escaparHTML(texto) {

        return String(texto)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    function escaparAtributo(texto) {

        return String(texto)
            .replace(/&/g, "&amp;")
            .replace(/"/g, "&quot;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
    }


    function aplicarPesquisa() {

        const termo =
            document.getElementById("search")
                .value
                .trim()
                .toLowerCase();


        const cards =
            document.querySelectorAll(
                ".event-card"
            );


        cards.forEach(card => {

            const texto =
                card
                    .getAttribute("data-search")
                    .toLowerCase();


            if (
                !termo ||
                texto.includes(termo)
            ) {

                card.style.display = "";

            } else {

                card.style.display = "none";
            }

        });


        document
            .querySelectorAll(".date-group")
            .forEach(grupo => {

                const cardsVisiveis =
                    Array.from(
                        grupo.querySelectorAll(
                            ".event-card"
                        )
                    )
                    .some(
                        card =>
                            card.style.display !==
                            "none"
                    );


                grupo.style.display =
                    cardsVisiveis
                        ? ""
                        : "none";
            });
    }


    async function carregarEventos() {

        const lista =
            document.getElementById("lista");


        try {

            const resposta =
                await fetch(
                    "eventos.json?" +
                    Date.now(),
                    {
                        cache: "no-store"
                    }
                );


            if (!resposta.ok) {

                throw new Error(
                    `HTTP ${resposta.status}`
                );
            }


            const dados =
                await resposta.json();


            if (!Array.isArray(dados)) {

                throw new Error(
                    "eventos.json não contém uma lista."
                );
            }


            let eventos =
                normalizarAtividades(
                    dados
                );


            eventos =
                eventos.filter(
                    evento =>
                        !foiEnviada(evento)
                );


            eventos =
                ordenarEventos(
                    eventos
                );


            todosEventos =
                eventos;


            atualizarResumo(
                eventos
            );


            renderizar(
                eventos
            );


            document.getElementById(
                "statusText"
            ).textContent =
                `${eventos.length} atividade${
                    eventos.length === 1
                        ? ""
                        : "s"
                } encontrada${
                    eventos.length === 1
                        ? ""
                        : "s"
                }`;


            /*
             * Caso exista pesquisa ativa,
             * reaplica depois da atualização.
             */
            aplicarPesquisa();


        } catch (erro) {

            console.error(
                "Erro ao carregar eventos:",
                erro
            );


            lista.innerHTML = `
                <div class="error">

                    Não foi possível carregar
                    as atividades.

                    <br><br>

                    Erro:
                    ${escaparHTML(erro.message)}

                </div>
            `;


            document.getElementById(
                "statusText"
            ).textContent =
                "Erro ao atualizar atividades.";
        }
    }


    document
        .getElementById("search")
        .addEventListener(
            "input",
            aplicarPesquisa
        );


    carregarEventos();


    /*
     * Atualiza automaticamente a cada minuto.
     */
    setInterval(
        carregarEventos,
        60 * 1000
    );

</script>

</body>
</html>
