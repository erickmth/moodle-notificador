<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prazos · Moodle</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#faf9f6;
    --surface:#ffffff;
    --ink:#1c2130;
    --muted:#6b7280;
    --line:#e7e4dc;
    --line-strong:#d8d4c8;

    --amber:#b6790a;
    --amber-bg:#fbf0dc;

    --green:#2f7d4f;
    --green-bg:#e5f3ea;

    --red:#b3261e;
    --red-bg:#fbe9e7;

    --slate-bg:#eef0f4;

    --shadow:
      0 1px 2px rgba(28,33,48,.04),
      0 8px 24px rgba(28,33,48,.05);
  }

  *{
    box-sizing:border-box;
  }

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:
      'Inter',
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Roboto,
      Arial,
      sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  button,
  input,
  select{
    font:inherit;
    color:inherit;
  }

  .wrap{
    width:min(880px,92%);
    margin:0 auto;
    padding:44px 0 80px;
  }

  /* Header */

  .head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:32px;
    flex-wrap:wrap;
  }

  .head h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:34px;
    letter-spacing:-.4px;
    margin:0;
  }

  .head .sub{
    color:var(--muted);
    font-size:14.5px;
    margin-top:6px;
  }

  .refresh{
    border:1px solid var(--line-strong);
    background:var(--surface);
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
    font-size:13.5px;
    font-weight:600;

    display:inline-flex;
    align-items:center;
    gap:7px;

    transition:
      border-color .15s,
      background .15s;
  }

  .refresh:hover{
    border-color:var(--ink);
  }

  .refresh:disabled{
    opacity:.5;
    cursor:default;
  }

  .refresh .spin{
    display:inline-block;
    transition:transform .5s;
  }

  .refresh.loading .spin{
    animation:spin 0.8s linear infinite;
  }

  @keyframes spin{
    to{
      transform:rotate(360deg);
    }
  }

  /* Summary */

  .summary{
    display:flex;
    gap:0;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    margin-bottom:22px;
    overflow:hidden;
    box-shadow:var(--shadow);
  }

  .summary > div{
    flex:1;
    padding:16px 18px;
    border-right:1px solid var(--line);
  }

  .summary > div:last-child{
    border-right:none;
  }

  .summary .num{
    font-size:23px;
    font-weight:700;
    line-height:1.1;
  }

  .summary .lbl{
    color:var(--muted);
    font-size:12.5px;
    margin-top:3px;
  }

  .summary .num.warn{
    color:var(--amber);
  }

  /* Controls */

  .controls{
    display:flex;
    gap:10px;
    margin-bottom:26px;
    flex-wrap:wrap;
  }

  .controls input[type=search]{
    flex:1 1 220px;
    height:42px;

    border:1px solid var(--line-strong);
    border-radius:10px;

    padding:0 14px;
    background:var(--surface);
    outline:none;
  }

  .controls input[type=search]:focus{
    border-color:var(--ink);
  }

  /* Status */

  .status{
    display:none;

    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;

    padding:16px 18px;
    margin-bottom:20px;

    color:var(--muted);
    font-size:14px;
  }

  .status.visible{
    display:block;
  }

  .status.error{
    color:var(--red);
    background:var(--red-bg);
    border-color:#f4c9c5;
  }

  /* Groups */

  .group{
    margin-bottom:30px;
  }

  .group-head{
    display:flex;
    align-items:baseline;
    gap:10px;

    margin-bottom:12px;
    padding-left:2px;
  }

  .group-head h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:18px;
    margin:0;
  }

  .group-head .count{
    color:var(--muted);
    font-size:13px;
  }

  .group.is-late .group-head h2{
    color:var(--red);
  }

  /* Timeline */

  .timeline{
    position:relative;
  }

  .item{
    position:relative;

    background:var(--surface);
    border:1px solid var(--line);
    border-left:3px solid var(--red);

    border-radius:12px;

    padding:16px 18px;
    margin-bottom:10px;

    box-shadow:var(--shadow);
  }

  .item-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    gap:14px;
  }

  .item-name{
    margin:0;

    font-size:16px;
    font-weight:600;
    line-height:1.4;

    word-break:break-word;
  }

  .item-course{
    color:var(--muted);
    font-size:13.5px;
    margin-top:4px;
  }

  /* Badge */

  .badge{
    flex-shrink:0;

    font-size:11.5px;
    font-weight:700;

    padding:4px 9px;

    border-radius:999px;
    white-space:nowrap;
  }

  .badge.tipo-close{
    color:var(--red);
    background:var(--red-bg);
  }

  /* Footer */

  .item-foot{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-top:12px;
    padding-top:12px;

    border-top:1px solid var(--line);

    gap:12px;
    flex-wrap:wrap;
  }

  .item-date{
    font-size:13.5px;
    color:var(--ink);
    font-weight:500;
  }

  .item-date .rel{
    color:var(--muted);
    font-weight:400;
  }

  .item-open{
    font-size:13px;
    font-weight:600;

    color:var(--ink);
    text-decoration:none;

    display:inline-flex;
    align-items:center;
    gap:4px;
  }

  .item-open:hover{
    text-decoration:underline;
  }

  /* Empty */

  .empty{
    background:var(--surface);
    border:1px dashed var(--line-strong);
    border-radius:14px;

    padding:56px 20px;

    text-align:center;
    color:var(--muted);
  }

  .empty h2{
    font-family:'Fraunces',serif;
    font-weight:600;

    color:var(--ink);
    font-size:19px;

    margin:0 0 6px;
  }

  .empty p{
    margin:0;
    font-size:14.5px;
  }

  /* Mobile */

  @media (max-width:640px){

    .wrap{
      padding:30px 0 60px;
    }

    .head h1{
      font-size:27px;
    }

    .summary{
      flex-direction:column;
    }

    .summary > div{
      border-right:none;
      border-bottom:1px solid var(--line);
    }

    .summary > div:last-child{
      border-bottom:none;
    }

    .item-top{
      flex-direction:column;
    }
  }
</style>
</head>

<body>

<main class="wrap">

  <!-- HEADER -->

  <header class="head">

    <div>

      <h1>Prazos</h1>

      <div class="sub">
        Encerramentos de atividades do AVA
      </div>

    </div>

    <button
      class="refresh"
      id="refreshBtn"
      type="button"
    >
      <span class="spin">↻</span>
      Atualizar
    </button>

  </header>


  <!-- SUMMARY -->

  <section class="summary">

    <div>

      <div
        class="num"
        id="statTotal"
      >
        0
      </div>

      <div class="lbl">
        encerramentos pendentes
      </div>

    </div>


    <div>

      <div
        class="num warn"
        id="statLate"
      >
        0
      </div>

      <div class="lbl">
        atrasados
      </div>

    </div>


    <div>

      <div
        class="num"
        id="statWeek"
      >
        0
      </div>

      <div class="lbl">
        nos próximos 7 dias
      </div>

    </div>


    <div>

      <div
        class="num"
        id="statNext"
      >
        —
      </div>

      <div class="lbl">
        próximo encerramento
      </div>

    </div>

  </section>


  <!-- SEARCH -->

  <section class="controls">

    <input
      type="search"
      id="searchInput"
      placeholder="Buscar por atividade ou disciplina..."
      autocomplete="off"
    >

  </section>


  <!-- STATUS -->

  <div
    class="status"
    id="status"
  ></div>


  <!-- EVENTS -->

  <div id="groups"></div>

</main>


<script>

  const els = {

    groups:
      document.getElementById('groups'),

    status:
      document.getElementById('status'),

    search:
      document.getElementById('searchInput'),

    refresh:
      document.getElementById('refreshBtn'),

    statTotal:
      document.getElementById('statTotal'),

    statLate:
      document.getElementById('statLate'),

    statWeek:
      document.getElementById('statWeek'),

    statNext:
      document.getElementById('statNext')

  };


  let eventos = [];


  /*
   * ============================================================
   * STATUS
   * ============================================================
   */

  function mostrarStatus(msg, erro = false){

    els.status.textContent = msg;

    els.status.classList.add('visible');

    els.status.classList.toggle(
      'error',
      erro
    );

  }


  function esconderStatus(){

    els.status.classList.remove(
      'visible',
      'error'
    );

  }


  /*
   * ============================================================
   * SEGURANÇA HTML
   * ============================================================
   */

  function escaparHTML(v){

    if (
      v === null ||
      v === undefined
    ){
      return '';
    }

    return String(v)
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'",'&#039;');

  }


  /*
   * ============================================================
   * NORMALIZAÇÃO
   * ============================================================
   */

  function normalizarTexto(valor){

    return String(valor || '')
      .trim()
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g,'')
      .replace(/\s+/g,' ');

  }


  /*
   * ============================================================
   * TIMESTAMP
   * ============================================================
   */

  function obterTimestamp(ev){

    return Number(
      ev.timestamp ??
      ev.timesort ??
      0
    );

  }


  /*
   * ============================================================
   * VERIFICAR SE É ENCERRAMENTO
   * ============================================================
   *
   * O Moodle envia:
   *
   * open  = abertura
   * due   = entrega
   * close = encerramento
   *
   * O painel agora aceita SOMENTE close.
   *
   */

  function ehEncerramento(ev){

    const tipo =
      String(ev.tipo || '')
        .trim()
        .toLowerCase();

    return tipo === 'close';

  }


  /*
   * ============================================================
   * VERIFICAR SE JÁ FOI ENVIADO
   * ============================================================
   *
   * Atualmente o eventos.json não possui necessariamente
   * essa informação.
   *
   * Porém deixamos o HTML preparado para quando o sistema
   * começar a gravar isso.
   *
   * Exemplos aceitos:
   *
   * enviado: true
   * notificacao_enviada: true
   * status: "enviado"
   * status: "sent"
   *
   */

  function foiEnviado(ev){

    if (
      ev.enviado === true
    ){
      return true;
    }

    if (
      ev.notificacao_enviada === true
    ){
      return true;
    }

    const status =
      normalizarTexto(
        ev.status
      );

    if (
      status === 'enviado' ||
      status === 'sent'
    ){
      return true;
    }

    if (
      ev.enviado_em ||
      ev.notificacao_enviada_em
    ){
      return true;
    }

    return false;

  }


  /*
   * ============================================================
   * CHAVE DA ATIVIDADE
   * ============================================================
   *
   * O Moodle pode criar eventos diferentes para a mesma
   * atividade:
   *
   * open
   * due
   * close
   *
   * Esses eventos possuem IDs diferentes.
   *
   * Como estamos usando apenas close, ainda podemos ter
   * duplicações do mesmo encerramento no JSON.
   *
   * Primeiro tentamos usar o ID da atividade presente na URL:
   *
   * /mod/assign/view.php?id=1293219
   *
   * Assim:
   *
   * mod/assign/view.php + 1293219
   *
   * vira a chave única.
   *
   */

  function extrairIdDaURL(url){

    if (!url){
      return '';
    }

    try{

      const endereco =
        new URL(url);

      const id =
        endereco.searchParams.get('id');

      return id || '';

    }catch(erro){

      return '';

    }

  }


  function criarChaveAtividade(ev){

    const url =
      String(ev.url || '')
        .trim();

    const idURL =
      extrairIdDaURL(url);


    /*
     * Caso tenha ID na URL,
     * ele é a melhor forma de identificar
     * a atividade.
     */

    if (idURL){

      try{

        const endereco =
          new URL(url);

        return [
          'url',
          endereco.pathname,
          idURL
        ].join(':');

      }catch(erro){

        return [
          'url-id',
          idURL
        ].join(':');

      }

    }


    /*
     * Fallback caso não exista URL.
     */

    const curso =
      normalizarTexto(
        ev.disciplina ||
        ev.curso_id ||
        ''
      );


    let nome =
      normalizarTexto(
        ev.nome ||
        ''
      );


    /*
     * Remove termos que podem variar
     * entre eventos da mesma atividade.
     */

    nome =
      nome.replace(
        /\s+esta marcado\(a\) para esta data$/i,
        ''
      );


    nome =
      nome.replace(
        /\s*\((abertura|encerramento).*?\)\s*$/i,
        ''
      );


    return [
      'fallback',
      curso,
      nome
    ].join('|');

  }


  /*
   * ============================================================
   * FILTRAR E REMOVER DUPLICADOS
   * ============================================================
   */

  function prepararEventos(dados){

    if (!Array.isArray(dados)){
      return [];
    }


    /*
     * 1. SOMENTE ENCERRAMENTOS
     *
     * 2. NÃO EXIBIR ENVIADOS
     */

    const apenasPendentes =
      dados.filter(ev => {

        if (!ehEncerramento(ev)){
          return false;
        }

        if (foiEnviado(ev)){
          return false;
        }

        return true;

      });


    /*
     * 3. REMOVER DUPLICADOS
     */

    const mapa =
      new Map();


    for (
      const evento
      of apenasPendentes
    ){

      const chave =
        criarChaveAtividade(evento);


      /*
       * Se não houver chave,
       * usa uma chave baseada no objeto.
       */

      const chaveFinal =
        chave ||
        [
          normalizarTexto(evento.nome),
          normalizarTexto(evento.disciplina),
          obterTimestamp(evento)
        ].join('|');


      /*
       * Se a mesma atividade aparecer
       * mais de uma vez, mantemos apenas
       * uma.
       *
       * Se houver duas versões,
       * ficamos com a que possui maior
       * timestamp.
       */

      if (!mapa.has(chaveFinal)){

        mapa.set(
          chaveFinal,
          evento
        );

      }else{

        const existente =
          mapa.get(chaveFinal);

        if (
          obterTimestamp(evento) >
          obterTimestamp(existente)
        ){

          mapa.set(
            chaveFinal,
            evento
          );

        }

      }

    }


    return Array.from(
      mapa.values()
    );

  }


  /*
   * ============================================================
   * TEXTO
   * ============================================================
   */

  function textoTipo(){

    return 'Encerramento';

  }


  function classeTipo(){

    return 'tipo-close';

  }


  /*
   * ============================================================
   * DATA / HORA
   * ============================================================
   */

  function formatarDataHora(ts){

    if (!ts){
      return null;
    }

    const d =
      new Date(
        Number(ts) * 1000
      );


    if (
      Number.isNaN(
        d.getTime()
      )
    ){

      return null;

    }


    return new Intl.DateTimeFormat(
      'pt-BR',
      {
        timeZone:
          'America/Sao_Paulo',

        day:'2-digit',
        month:'2-digit',
        year:'numeric',

        hour:'2-digit',
        minute:'2-digit'
      }
    ).format(d);

  }


  /*
   * ============================================================
   * INÍCIO DO DIA
   * ============================================================
   */

  function inicioDoDia(
    offsetDias = 0
  ){

    const agora =
      new Date();

    const d =
      new Date(
        agora.getFullYear(),
        agora.getMonth(),
        agora.getDate() +
          offsetDias
      );

    return (
      d.getTime() / 1000
    );

  }


  /*
   * ============================================================
   * TEXTO RELATIVO
   * ============================================================
   */

  function textoRelativo(ts){

    const agora =
      Date.now() / 1000;

    const diffSeg =
      ts - agora;

    const diffDias =
      Math.round(
        diffSeg / 86400
      );


    if (diffSeg < 0){

      const atraso =
        Math.abs(diffDias);


      if (atraso === 0){
        return 'atrasado hoje';
      }


      return (
        `${atraso} dia` +
        `${atraso === 1 ? '' : 's'}` +
        ` de atraso`
      );

    }


    if (diffDias === 0){
      return 'hoje';
    }


    if (diffDias === 1){
      return 'amanhã';
    }


    if (diffDias < 7){

      return `em ${diffDias} dias`;

    }


    return null;

  }


  /*
   * ============================================================
   * GRUPOS
   * ============================================================
   */

  function grupoDe(ts){

    if (!ts){
      return 'sem-data';
    }


    const hojeInicio =
      inicioDoDia(0);

    const amanhaInicio =
      inicioDoDia(1);

    const depoisInicio =
      inicioDoDia(2);

    const semanaFim =
      inicioDoDia(7);

    const mesFim =
      inicioDoDia(30);


    if (
      ts < hojeInicio
    ){
      return 'atrasado';
    }


    if (
      ts < amanhaInicio
    ){
      return 'hoje';
    }


    if (
      ts < depoisInicio
    ){
      return 'amanha';
    }


    if (
      ts < semanaFim
    ){
      return 'semana';
    }


    if (
      ts < mesFim
    ){
      return 'mes';
    }


    return 'depois';

  }


  const ORDEM_GRUPOS = [

    {
      id:'atrasado',
      titulo:'Atrasado',
      late:true
    },

    {
      id:'hoje',
      titulo:'Hoje'
    },

    {
      id:'amanha',
      titulo:'Amanhã'
    },

    {
      id:'semana',
      titulo:'Esta semana'
    },

    {
      id:'mes',
      titulo:'Este mês'
    },

    {
      id:'depois',
      titulo:'Mais adiante'
    },

    {
      id:'sem-data',
      titulo:'Sem data'
    }

  ];


  /*
   * ============================================================
   * HTML DE CADA EVENTO
   * ============================================================
   */

  function itemHTML(ev){

    const nome =
      escaparHTML(
        ev.nome ||
        'Atividade sem nome'
      );


    const disciplina =
      escaparHTML(
        ev.disciplina ||
        'Disciplina não identificada'
      );


    const ts =
      obterTimestamp(ev);


    const dataFormatada =
      formatarDataHora(ts) ||
      'Data não informada';


    const rel =
      ts
        ? textoRelativo(ts)
        : null;


    const url =
      ev.url
        ? String(ev.url)
        : '';


    /*
     * Segurança:
     * só permite links do Moodle.
     */

    let linkMoodle = '';


    if (url){

      try{

        const endereco =
          new URL(url);

        const permitido =
          endereco.protocol === 'https:' &&
          endereco.hostname ===
            'ava.fiep.digital';


        if (permitido){

          linkMoodle = `
            <a
              class="item-open"
              href="${escaparHTML(url)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              Abrir no Moodle →
            </a>
          `;

        }

      }catch(erro){

        linkMoodle = '';

      }

    }


    return `

      <article class="item tipo-close">

        <div class="item-top">

          <div>

            <h3 class="item-name">
              ${nome}
            </h3>

            <div class="item-course">
              ${disciplina}
            </div>

          </div>


          <span class="badge tipo-close">
            Encerramento
          </span>

        </div>


        <div class="item-foot">

          <div class="item-date">

            ${escaparHTML(dataFormatada)}

            ${
              rel
                ? `
                  <span class="rel">
                    · ${escaparHTML(rel)}
                  </span>
                `
                : ''
            }

          </div>


          ${linkMoodle}

        </div>

      </article>

    `;

  }


  /*
   * ============================================================
   * RENDERIZAR
   * ============================================================
   */

  function renderizar(){

    const termo =
      els.search.value
        .trim()
        .toLowerCase();


    /*
     * Busca somente dentro dos eventos
     * que já foram filtrados como close.
     */

    const filtrados =
      eventos.filter(ev => {

        const nome =
          String(
            ev.nome || ''
          ).toLowerCase();


        const disciplina =
          String(
            ev.disciplina || ''
          ).toLowerCase();


        return (
          !termo ||
          nome.includes(termo) ||
          disciplina.includes(termo)
        );

      });


    /*
     * ==========================================================
     * ESTATÍSTICAS
     * ==========================================================
     */

    els.statTotal.textContent =
      eventos.length;


    const agora =
      Date.now() / 1000;


    const atrasadas =
      eventos.filter(ev => {

        const ts =
          obterTimestamp(ev);

        return (
          ts &&
          ts < agora
        );

      }).length;


    els.statLate.textContent =
      atrasadas;


    const semanaFim =
      inicioDoDia(7);


    const naSemana =
      eventos.filter(ev => {

        const ts =
          obterTimestamp(ev);


        return (
          ts >= agora &&
          ts < semanaFim
        );

      }).length;


    els.statWeek.textContent =
      naSemana;


    const futuras =
      eventos
        .filter(ev =>
          obterTimestamp(ev) >
          agora
        )
        .sort(
          (a,b) =>
            obterTimestamp(a) -
            obterTimestamp(b)
        );


    if (futuras.length){

      const d =
        new Date(
          obterTimestamp(
            futuras[0]
          ) * 1000
        );


      els.statNext.textContent =
        new Intl.DateTimeFormat(
          'pt-BR',
          {
            timeZone:
              'America/Sao_Paulo',

            day:'2-digit',
            month:'2-digit'
          }
        ).format(d);

    }else{

      els.statNext.textContent =
        '—';

    }


    /*
     * ==========================================================
     * VAZIO
     * ==========================================================
     */

    if (!filtrados.length){

      els.groups.innerHTML = `

        <div class="empty">

          <h2>
            Nada por aqui
          </h2>

          <p>
            Não há encerramentos pendentes
            para exibir.
          </p>

        </div>

      `;

      return;

    }


    /*
     * ==========================================================
     * AGRUPAR
     * ==========================================================
     */

    const grupos = {};


    for (
      const ev
      of filtrados
    ){

      const g =
        grupoDe(
          obterTimestamp(ev)
        );


      (
        grupos[g] ??= []
      ).push(ev);

    }


    /*
     * Ordenar cada grupo
     * pela data de encerramento.
     */

    for (
      const lista
      of Object.values(grupos)
    ){

      lista.sort(
        (a,b) =>
          obterTimestamp(a) -
          obterTimestamp(b)
      );

    }


    /*
     * ==========================================================
     * MONTAR HTML
     * ==========================================================
     */

    els.groups.innerHTML =

      ORDEM_GRUPOS

        .filter(
          g =>
            grupos[g.id]?.length
        )

        .map(g => `

          <section
            class="group ${
              g.late
                ? 'is-late'
                : ''
            }"
          >

            <div class="group-head">

              <h2>
                ${g.titulo}
              </h2>

              <span class="count">
                ${grupos[g.id].length}
              </span>

            </div>


            <div class="timeline">

              ${
                grupos[g.id]
                  .map(itemHTML)
                  .join('')
              }

            </div>

          </section>

        `)

        .join('');

  }


  /*
   * ============================================================
   * CARREGAR JSON
   * ============================================================
   */

  async function carregar(){

    mostrarStatus(
      'Carregando eventos...'
    );


    els.refresh.disabled =
      true;


    els.refresh.classList.add(
      'loading'
    );


    try{

      const resposta =
        await fetch(
          `eventos.json?t=${Date.now()}`
        );


      if (!resposta.ok){

        throw new Error(
          `HTTP ${resposta.status}`
        );

      }


      const dados =
        await resposta.json();


      if (!Array.isArray(dados)){

        throw new Error(
          'eventos.json não contém uma lista.'
        );

      }


      /*
       * Aqui acontece o filtro principal.
       *
       * eventos.json pode conter:
       *
       * open
       * due
       * close
       *
       * O painel recebe tudo,
       * mas prepararEventos()
       * deixa passar somente close.
       */

      eventos =
        prepararEventos(dados);


      esconderStatus();


      renderizar();


    }catch(erro){

      console.error(erro);


      mostrarStatus(
        'Não foi possível carregar o eventos.json. Abra o painel por um servidor (ou GitHub Pages), não diretamente pelo arquivo.',
        true
      );


      els.groups.innerHTML =
        '';


    }finally{

      els.refresh.disabled =
        false;


      els.refresh.classList.remove(
        'loading'
      );

    }

  }


  /*
   * ============================================================
   * EVENTOS DA INTERFACE
   * ============================================================
   */

  els.search.addEventListener(
    'input',
    renderizar
  );


  els.refresh.addEventListener(
    'click',
    carregar
  );


  /*
   * ============================================================
   * INICIALIZAÇÃO
   * ============================================================
   */

  carregar();

</script>

</html>
